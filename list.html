<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission List - Amis</title>
  <link rel="stylesheet" href="https://unpkg.com/amis@3.6.0/sdk/sdk.css" />
  <style>
    :root {
      --primary: #4A5CBF;
      --primary-hover: #3d4fb0;
      --primary-light: #F0F1FF;
      --page-bg: #F5F6FA;
      --card-bg: #FFFFFF;
      --input-border: #D9DDE6;
      --input-border-focus: #4A5CBF;
      --text-primary: #333333;
      --text-secondary: #666666;
      --text-placeholder: #9CA3AF;
      --text-label: #2D3348;
      --divider: #E8E8E8;
      --danger: #E84545;
      --success: #52c41a;
      --warning: #faad14;
      --shadow-card: 0 1px 4px rgba(0,0,0,0.04);
      --radius-sm: 4px;
      --radius-md: 6px;
      --input-height: 36px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      font-family: var(--font-family);
      color: var(--text-primary);
    }

    .list-root {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 32px;
    }

    .breadcrumb {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .breadcrumb a { color: var(--text-secondary); text-decoration: none; }
    .breadcrumb a:hover { color: var(--primary); }
    .breadcrumb .current { color: var(--text-primary); font-weight: 500; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .page-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin: 0; }
    .btn-add {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; font-size: 14px; font-weight: 500;
      border: none; border-radius: var(--radius-sm);
      background: var(--primary); color: #fff; cursor: pointer;
      font-family: var(--font-family);
    }
    .btn-add:hover { background: var(--primary-hover); }

    .search-card {
      background: var(--card-bg); border-radius: var(--radius-md);
      box-shadow: var(--shadow-card); padding: 20px 24px; margin-bottom: 16px;
    }
    .search-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
    .search-field { flex: 1; min-width: 180px; }
    .search-field label { display: block; font-size: 13px; font-weight: 500; color: var(--text-label); margin-bottom: 6px; }
    .search-field input, .search-field select {
      width: 100%; height: var(--input-height); padding: 0 12px;
      font-size: 14px; border: 1px solid var(--input-border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      background: var(--card-bg); font-family: var(--font-family); box-sizing: border-box;
    }
    .search-field input:focus, .search-field select:focus {
      border-color: var(--input-border-focus); outline: none;
      box-shadow: 0 0 0 2px rgba(74,92,191,0.08);
    }
    .search-field input::placeholder { color: var(--text-placeholder); }

    .date-range { display: flex; align-items: center; gap: 8px; }
    .date-range input { flex: 1; width: auto; }
    .date-range .sep { color: var(--text-placeholder); font-size: 14px; }

    .search-actions { display: flex; gap: 8px; align-items: center; }
    .btn-search {
      height: var(--input-height); padding: 0 20px; font-size: 14px; font-weight: 500;
      border: 1px solid var(--primary); border-radius: var(--radius-sm);
      background: var(--primary); color: #fff; cursor: pointer; font-family: var(--font-family);
    }
    .btn-search:hover { background: var(--primary-hover); }
    .btn-clear {
      height: var(--input-height); padding: 0 20px; font-size: 14px; font-weight: 500;
      border: 1px solid var(--input-border); border-radius: var(--radius-sm);
      background: var(--card-bg); color: var(--text-secondary); cursor: pointer; font-family: var(--font-family);
    }
    .btn-clear:hover { background: #f5f5f5; }

    .table-card { background: var(--card-bg); border-radius: var(--radius-md); box-shadow: var(--shadow-card); overflow: hidden; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table thead th {
      background: #F8F9FC; padding: 12px 16px; text-align: left;
      font-weight: 600; color: var(--text-label); border-bottom: 1px solid var(--divider); white-space: nowrap;
    }
    .data-table tbody td { padding: 12px 16px; border-bottom: 1px solid var(--divider); color: var(--text-primary); vertical-align: middle; }
    .data-table tbody tr:hover { background: #F8F9FC; }
    .data-table tbody tr:last-child td { border-bottom: none; }

    .cell-code { font-weight: 500; color: var(--text-primary); }
    .cell-name { color: var(--primary); cursor: pointer; text-decoration: none; }
    .cell-name:hover { text-decoration: underline; }
    .cell-yes { color: var(--success); font-weight: 500; }
    .cell-no { color: var(--text-placeholder); }
    .cell-continue {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 12px; font-weight: 500; background: #E8F0FF; color: var(--primary);
    }
    .cell-single {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 12px; font-weight: 500; background: #F5F5F5; color: var(--text-secondary);
    }
    .rule-status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .rule-status-dot.active { background: var(--success); }
    .rule-status-dot.inactive { background: var(--text-placeholder); }

    .action-links { display: flex; gap: 12px; white-space: nowrap; }
    .action-link { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 500; cursor: pointer; }
    .action-link:hover { text-decoration: underline; }

    .pagination-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-top: 1px solid var(--divider);
      font-size: 13px; color: var(--text-secondary);
    }
    .pagination-info { display: flex; align-items: center; gap: 8px; }
    .pagination-controls { display: flex; align-items: center; gap: 4px; }
    .page-btn {
      width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; border: 1px solid var(--input-border); border-radius: var(--radius-sm);
      background: var(--card-bg); color: var(--text-primary); cursor: pointer; font-family: var(--font-family);
    }
    .page-btn:hover { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .page-btn.disabled { opacity: 0.4; cursor: default; }
    .page-size-select {
      height: 28px; padding: 0 8px; font-size: 13px;
      border: 1px solid var(--input-border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-family: var(--font-family); margin-left: 8px;
    }

    .loading-overlay {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column; gap: 16px;
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid #e0e0e0;
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root">
  <div class="loading-overlay">
    <div class="loading-spinner"></div>
    <div style="font-size:14px;color:#666;">Loading...</div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var mockMissions = [
    {
      missionCode: 'SUMM01', missionName: 'Summer spending mission',
      enrollStart: '01/01/2026 00:00:00', enrollEnd: '01/01/2026 23:59:59',
      missionStart: '01/01/2026 00:00:00', missionEnd: '01/02/2026 23:59:59',
      missionType: 'Daily Check-in', showMissionCenter: true,
      quota: 50000, minRegistration: 100,
      continuousOrIndependent: 'Continue', ruleDisplayStatus: 'Active', id: 1
    },
    {
      missionCode: 'SUMM01', missionName: 'Summer spending mission Daily Check-in (000000000...)',
      enrollStart: '01/01/2026 00:00:00', enrollEnd: '10/01/2026 23:59:59',
      missionStart: '01/01/2026 00:00:00', missionEnd: '01/02/2026 23:59:59',
      missionType: 'Daily Check-in', showMissionCenter: true,
      quota: 50000, minRegistration: 100,
      continuousOrIndependent: 'Continue', ruleDisplayStatus: 'Active', id: 2
    },
    {
      missionCode: 'SUMM01', missionName: 'Summer spending mission Daily Check-in (000000000...)',
      enrollStart: '01/01/2026 00:00:00', enrollEnd: '10/01/2026 23:59:59',
      missionStart: '01/01/2026 00:00:00', missionEnd: '01/02/2026 23:59:59',
      missionType: 'Daily Check-in', showMissionCenter: true,
      quota: 50000, minRegistration: 100,
      continuousOrIndependent: 'Continue', ruleDisplayStatus: 'Active', id: 3
    }
  ];

  var currentPage = 1;
  var pageSize = 10;

  function renderTable() {
    var container = document.getElementById('root');
    var totalPages = Math.ceil(mockMissions.length / pageSize);

    // Build mission rows
    var rowsHtml = mockMissions.map(function(m) {
      var showCenter = m.showMissionCenter
        ? '<span class="cell-yes">Yes</span>'
        : '<span class="cell-no">No</span>';
      var contClass = m.continuousOrIndependent === 'Continue' ? 'cell-continue' : 'cell-single';
      var statusDot = m.ruleDisplayStatus === 'Active' ? 'active' : 'inactive';

      return '<tr>' +
        '<td><div class="cell-code">' + m.missionCode + '</div>' +
        '<div><a href="index.html?id=' + m.id + '" class="cell-name">' + m.missionName + '</a></div></td>' +
        '<td><div>' + m.enrollStart + '</div><div>' + m.enrollEnd + '</div></td>' +
        '<td><div>' + m.missionStart + '</div><div>' + m.missionEnd + '</div></td>' +
        '<td>' + m.missionType + '</td>' +
        '<td>' + showCenter + '</td>' +
        '<td>' + m.quota.toLocaleString() + '</td>' +
        '<td>' + m.minRegistration + '</td>' +
        '<td><span class="' + contClass + '">' + m.continuousOrIndependent + '</span></td>' +
        '<td><span class="rule-status-dot ' + statusDot + '"></span>' +
        (m.ruleDisplayStatus === 'Active' ? 'Active' : 'Inactive') + '</td>' +
        '<td><div class="action-links">' +
        '<a href="index.html?id=' + m.id + '" class="action-link">View</a>' +
        '<a href="index.html?id=' + m.id + '" class="action-link">Edit</a>' +
        '</div></td></tr>';
    }).join('');

    // Build pagination buttons
    var pageButtons = '';
    pageButtons += '<button class="page-btn' + (currentPage === 1 ? ' disabled' : '') + '" onclick="goPage(' + (currentPage - 1) + ')">\u2039</button>';
    for (var i = 1; i <= totalPages; i++) {
      pageButtons += '<button class="page-btn' + (currentPage === i ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    pageButtons += '<button class="page-btn' + (currentPage === totalPages ? ' disabled' : '') + '" onclick="goPage(' + (currentPage + 1) + ')">\u203A</button>';

    container.innerHTML =
      '<div class="list-root">' +
        '<div class="breadcrumb">' +
          '<a href="list.html">Promotion</a> / ' +
          '<a href="list.html">Marketing Tools</a> / ' +
          '<span class="current">Mission</span>' +
        '</div>' +
        '<div class="page-header">' +
          '<h1 class="page-title">Mission List</h1>' +
          '<a href="index.html" class="btn-add">+ Add</a>' +
        '</div>' +
        '<div class="search-card">' +
          '<div class="search-row">' +
            '<div class="search-field">' +
              '<label>Mission Code / Name</label>' +
              '<input type="text" placeholder="Please input">' +
            '</div>' +
            '<div class="search-field">' +
              '<label>Enrollment Period</label>' +
              '<div class="date-range">' +
                '<input type="text" placeholder="Start Date">' +
                '<span class="sep">~</span>' +
                '<input type="text" placeholder="End Date">' +
              '</div>' +
            '</div>' +
            '<div class="search-field">' +
              '<label>Mission Period</label>' +
              '<div class="date-range">' +
                '<input type="text" placeholder="Start Date">' +
                '<span class="sep">~</span>' +
                '<input type="text" placeholder="End Date">' +
              '</div>' +
            '</div>' +
            '<div class="search-field" style="flex:0 0 160px;">' +
              '<label>Show Mission Center</label>' +
              '<select><option value="">Please Select</option>' +
              '<option value="yes">Yes</option><option value="no">No</option></select>' +
            '</div>' +
            '<div class="search-actions">' +
              '<button class="btn-clear">Clear</button>' +
              '<button class="btn-search">Search</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="table-card">' +
          '<table class="data-table">' +
            '<thead><tr>' +
              '<th>Mission Code / Name</th>' +
              '<th>Enrollment Period</th>' +
              '<th>Mission Period</th>' +
              '<th>Mission Type</th>' +
              '<th>Show Mission Center</th>' +
              '<th>Quota</th>' +
              '<th>Minimum Registration</th>' +
              '<th>Continuous or Independent</th>' +
              '<th>Rule Display Status</th>' +
              '<th style="width:120px;">Operation</th>' +
            '</tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>' +
          '<div class="pagination-bar">' +
            '<div class="pagination-info">' +
              'Total ' + mockMissions.length + ' items' +
              '&nbsp;&nbsp;' +
              '<select class="page-size-select" onchange="changePageSize(this.value)">' +
                '<option value="10"' + (pageSize === 10 ? ' selected' : '') + '>10/page</option>' +
                '<option value="20"' + (pageSize === 20 ? ' selected' : '') + '>20/page</option>' +
                '<option value="50"' + (pageSize === 50 ? ' selected' : '') + '>50/page</option>' +
              '</select>' +
            '</div>' +
            '<div class="pagination-controls">' + pageButtons + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  window.goPage = function(p) {
    var totalPages = Math.ceil(mockMissions.length / pageSize);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
  };

  window.changePageSize = function(s) {
    pageSize = parseInt(s);
    currentPage = 1;
    renderTable();
  };

  renderTable();
});
</script>
</body>
</html>
